<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="container">
        <h1>Expense Tracker</h1>
        <h2 id="balance">Balance: ₹0</h2>
        <h3 id="counter">Transactions: 0</h3>


        <select id="filter" onchange="renderTransactions()">
    <option value="all">All</option>
    <option value="income">Income</option>
    <option value="expense">Expense</option>
</select>


        <div class="dashboard">
    <div class="box income-box">
        Income: ₹<span id="income">0</span>
    </div>


    <div class="box expense-box">
        Expense: ₹<span id="expense">0</span>
    </div>
</div>


        <div id="chartArea"></div>


        <div class="input-box">
        <input type="text" id="description" placeholder="Enter description">
        <input type="number" id="amount" placeholder="Enter amount">
        <input type="text" id="category" placeholder="Enter category (Food, Rent...)">


        <label>
        <input type="checkbox" id="isExpense">
          This is Expense
        </label>
       


        <button onclick="tracker()">Tracker</button>
            </div>


      <ul id="list"></ul>
</div>
<script src="script.js"></script>
</body>
</html>
