<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="container">
        <h1>Expense Tracker</h1>
        <h2 id="balance">Balance: ₹0</h2>
        <h3 id="counter">Transactions: 0</h3>
       


<select id="filter" onchange="renderTransactions()">


    <option value="all">All</option>
    <option value="income">Income</option>
    <option value="expense">Expense</option>
</select>


<select id="categoryFilter" onchange="renderTransactions()">
    <option value="all">All Categories</option>
</select>




<input
type="text"
id="searchInput"
placeholder="Search transaction">




<select id="sortAmount" onchange="renderTransactions()">
    <option value="default">Sort Amount</option>
    <option value="high">High to Low</option>
    <option value="low">Low to High</option>
</select>




<select id="dateFilter">
    <option value="all">All Dates</option>
    <option value="today">Today</option>
    <option value="month">This Month</option>
</select>






<button id="btnAll" onclick="renderTransactions()">All</button>
<button id="btnToday" onclick="showToday()">Today</button>
<button id="btnMonth" onclick="showMonth()">This Month</button>








        <div class="dashboard">
    <div class="box income-box">
        Income: ₹<span id="income">0</span>
    </div>


    <div class="box expense-box">
        Expense: ₹<span id="expense">0</span>
    </div>
</div>


       
       


        <div class="input-box">
        <input type="text" id="description" placeholder="Enter description">
        <input type="number" id="amount" placeholder="Enter amount">
        <input type="text" id="category" placeholder="Enter category (Food, Rent...)">
       
       <input type="date" id="date" value="">
        <label>
        <input type="checkbox" id="isExpense">
          This is Expense
        </label>
       


        <button onclick="tracker()">Tracker</button>
            </div>


       
      <div id="summaryArea"></div>


      <ul id="list"></ul>


     


<div id="chartArea"></div>
</div>
<script src="script.js"></script>
</body>
</html>
